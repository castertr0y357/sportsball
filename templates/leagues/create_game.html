{% extends "base.html" %}
{% block title %}Schedule Game | {{ season.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:650px; margin:0 auto;">
    <h1>Schedule Game for {{ season.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn">Save Game</button>
            <a href="{% url 'season_detail' season.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
