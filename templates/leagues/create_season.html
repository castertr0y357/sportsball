{% extends "base.html" %}
{% block title %}Create Season | {{ league.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:650px; margin:0 auto;">
    <h1>Create Season for {{ league.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn">Create Season</button>
            <a href="{% url 'season_list' league.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
