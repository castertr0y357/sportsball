{% extends "base.html" %}
{% block title %}Post Announcement | Church Sports Leagues{% endblock %}

{% block content %}
<div class="card" style="max-width:650px; margin:0 auto;">
    <h1>Post League Announcement or Devotional</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn">Publish Announcement</button>
            <a href="{% url 'announcement_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
