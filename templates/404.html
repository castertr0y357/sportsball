{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) &bull; SportsBall</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .error-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 1rem;
            max-width: 520px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .error-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
        }
        .error-code {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #f1f5f9;
        }
        .error-message {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 1.75rem;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-outline {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">⚾💨</div>
            <div class="error-code">404 &bull; Out of Bounds</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">The game, page, or roster you were looking for doesn't exist or has moved fields.</p>
            <div class="error-actions">
                <a href="/" class="btn-primary">Return to Home</a>
                <a href="javascript:history.back()" class="btn-outline">Go Back</a>
            </div>
        </div>
    </div>
</body>
</html>
