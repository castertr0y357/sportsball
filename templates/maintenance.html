{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance in Progress &bull; SportsBall</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        .maintenance-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .maintenance-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 1rem;
            max-width: 540px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .maintenance-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .maintenance-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #f1f5f9;
        }
        .maintenance-message {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            white-space: pre-wrap;
        }
        .maintenance-badge {
            display: inline-block;
            background: #d97706;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
        }
        .maintenance-actions {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }
        .maintenance-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .maintenance-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-card">
            <div class="maintenance-icon">&#128736;&#65039;</div>
            <div class="maintenance-badge">Platform Maintenance</div>
            <h1 class="maintenance-title">Scheduled Upgrades Underway</h1>
            <p class="maintenance-message">{{ setting.maintenance_message }}</p>
            <div class="maintenance-actions">
                <a href="{% url 'login' %}" class="maintenance-link">&#128273; Administrative Login</a>
            </div>
        </div>
    </div>
</body>
</html>
