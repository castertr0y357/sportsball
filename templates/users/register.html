{% extends "base.html" %}
{% block title %}Sign Up | Church Sports Leagues{% endblock %}

{% block content %}
<div class="card" style="max-width:600px; margin:1.5rem auto;">
    <h1>Player &amp; Coach Registration</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%;">Create Account</button>
    </form>
    <p style="margin-top:1rem; text-align:center;">
        Already registered? <a href="{% url 'login' %}">Log in here</a>
    </p>
</div>
{% endblock %}
