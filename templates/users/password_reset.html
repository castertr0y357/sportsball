{% extends "base.html" %}
{% block title %}Reset Password | SportsBall{% endblock %}

{% block content %}
<div class="card" style="max-width:480px; margin:2rem auto;">
    <h1>Reset Password</h1>
    <p style="color:var(--text-muted);">
        Enter the email address associated with your account, and we'll email you instructions to set a new password.
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="width:100%; margin-top:0.5rem;">Send Reset Link</button>
    </form>
    <p style="margin-top:1.25rem; text-align:center;">
        <a href="{% url 'login' %}">&larr; Back to Log In</a>
    </p>
</div>
{% endblock %}
